name: Proxy smoke test

# Manual check of the Places proxy from GitHub's servers (useful when the local network can't
# reach workers.dev). The guard checks are free; the final search uses 1 of the day's Google calls.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guards and one live search
        env:
          URL: ${{ vars.PLACES_PROXY_URL }}
          ORIGIN: https://raheel1-6.github.io
        run: |
          set -u
          U="$URL/v1/search"
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          fail=0
          expect() { if [ "$2" = "$3" ]; then echo "ok   $1 ($3)"; else echo "FAIL $1: got $2, expected $3"; fail=1; fi; }

          expect "unknown origin refused" "$(code -X POST -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -d '{}' "$U")" 403
          expect "CORS preflight" "$(code -X OPTIONS -H "Origin: $ORIGIN" "$U")" 204
          expect "non-sport query refused" "$(code -X POST -H "Origin: $ORIGIN" -H 'Content-Type: application/json' -d '{"query":"pizza","bbox":[29.04,40.955,29.08,40.98]}' "$U")" 400
          expect "box outside İstanbul refused" "$(code -X POST -H "Origin: $ORIGIN" -H 'Content-Type: application/json' -d '{"query":"halı saha","bbox":[32.8,39.9,32.9,40]}' "$U")" 400

          body=$(curl -s -w '\n%{http_code}' -X POST -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
            -d '{"query":"spor tesisi","bbox":[29.04,40.955,29.08,40.98],"lang":"tr"}' "$U")
          status=$(echo "$body" | tail -n1)
          json=$(echo "$body" | sed '$d')
          echo "live search: HTTP $status"
          echo "$json" | jq -c '.'
          echo "$json" | jq '{count: ((.places // []) | length), sample: [(.places // [])[:3][] | {name, rating, count}]}'
          [ "$status" = 200 ] || fail=1
          exit $fail
