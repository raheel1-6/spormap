# Cloudflare Worker for the Places proxy. Deploy steps: docs/PROXY.md
name = "spormap-places"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://raheel1-6.github.io,http://localhost:4321,http://localhost:4322"
# Hard cost cap enforced by the proxy (Google's Places quota may not be adjustable).
# ~1,000 Text Search (Enterprise) calls/month are free; these leave a margin. "0" = ratings off.
DAILY_LIMIT = "30"
MONTHLY_LIMIT = "850"

# Global counter of Google calls (SQLite-backed Durable Object, available on Workers Free).
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

# Per-IP rate limit (free on Workers): 20 searches per minute per visitor.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Secrets (never in this file):
#   npx wrangler secret put PLACES_API_KEY
#   npx wrangler secret put TURNSTILE_SECRET   (optional)
